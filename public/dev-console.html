<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accedi — AgencyDesk</title>
<link rel="icon" href="/img/logo-marchio.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-blob blob-1"></div>
  <div class="login-blob blob-2"></div>
  <div class="login-blob blob-3"></div>
  <div class="login-box">
    <img src="/img/logo-verticale.png" alt="AgencyDesk" class="login-logo">
    <p class="sottotitolo">Accedi per gestire clienti e scadenze</p>
    <div id="errore" class="errore"></div>
    <form id="form-login">
      <div class="campo">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="campo">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">Accedi</button>
    </form>
  </div>
  <footer class="login-footer">
    Developed by <a href="https://www.poshmapcrew.com" target="_blank" rel="noopener noreferrer">Poshmap</a>
  </footer>
</div>
<script src="/js/login.js"></script>
</body>
</html>
